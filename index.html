<!DOCTYPE html>
<html ng-app="NarrowItDownApp">
<head>
  <meta charset="utf-8">
  <title>Narrow Down Menu</title>
</head>
<body ng-controller="NarrowItDownController as ctrl">

  <div>
    <input type="text" ng-model="ctrl.searchTerm" placeholder="Search description...">
    <button ng-click="ctrl.narrowDown()">Narrow It Down For Me!</button>
  </div>

  <found-items items="ctrl.found" on-remove="ctrl.removeItem(index)"></found-items>
  <p ng-if="ctrl.nothingFound">Nothing found</p>

  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
